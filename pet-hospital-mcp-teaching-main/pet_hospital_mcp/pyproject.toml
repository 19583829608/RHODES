[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pet-hospital-mcp"
version = "1.0.0"
description = "Stateless MCP 2026-07-28 adapter for the Go Pet Hospital REST API (stage 1: list_pets)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.0.0",
    "httpx>=0.28,<1.0",
    "pydantic>=2.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pet_hospital_mcp"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra"
